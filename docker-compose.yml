services:
  fileserversync:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileserversync-image
    container_name: fileserversync-container
    restart: unless-stopped
    stop_grace_period: 90s
    volumes:
      - /var/log/fullauditlog/samba_audit.log:/var/log/fullauditlog/samba_audit.log:ro
      - ./config.properties:/app/config.properties:ro
      - ~/.ssh:/root/.ssh:ro
      - /srv/samba/schools/default-school:/srv/samba/schools/default-school:rw
    healthcheck:
      test: ["CMD", "/usr/local/bin/fileserversync-healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
