# Copy to config.properties. Never commit site-specific configuration or credentials.
sync.servers=replica-1.example.net,replica-2.example.net
root.path=/srv/samba/schools/default-school
audit.log.path=/var/log/fullauditlog/samba_audit.log
state.directory=/var/lib/fileserversync
health.file=/tmp/fileserversync.heartbeat
bwlimit=3000
buffer.time.seconds=30
rsync.timeout.seconds=1800
ssh.timeout.seconds=120
max.concurrent.syncs=4
max.queued.log.lines=20000
max.read.lines.per.tick=500
retry.initial.seconds=5
retry.max.seconds=300
connection.cache.seconds=30
watchdog.seconds=180
health.max.backlog.seconds=3600
shutdown.timeout.seconds=30
# SSH authenticates and encrypts transfers. Daemon mode is an explicit trusted-network choice.
rsync.daemon.enabled=false
rsync.daemon.module=default-school
ssh.user=root
ssh.identity.file=/root/.ssh/id_ed25519
ssh.known.hosts.file=/root/.ssh/known_hosts
# Applies ONLY when there is no saved cursor. Restarts always resume persisted state.
replay.existing.log.on.startup=false
# Enable only after confirming deletion semantics, topology and independent backups.
propagate.deletes=false
# Optional production-compatible two-hop routing; see docs/OPERATIONS.md.
relay.host=
